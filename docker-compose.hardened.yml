# HARDENED LOCAL/DEMO ONLY: private state services and bounded Nginx traffic,
# but still HTTP and development credentials loaded from the local .env.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: channels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d channels"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [hardened_internal, checkpoint_db]

  rabbitmq:
    image: rabbitmq:3.13-management
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [hardened_internal]

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [hardened_internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      TRUSTED_PROXY_CIDRS: '["172.31.240.10/32"]'
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    volumes:
      - uploads_data:/data/uploads
    command: >-
      sh -c "alembic upgrade head && python -m app.db.bootstrap_schema &&
      python -m app.db.bootstrap_superadmin &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000
      --ws-max-size $${WS_MAX_INBOUND_MESSAGE_BYTES:-16384}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [hardened_internal]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/channels}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1.0}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_INITIAL_RETRY_DELAY_SECONDS: ${OUTBOX_INITIAL_RETRY_DELAY_SECONDS:-5}
      OUTBOX_RETRY_BACKOFF_MULTIPLIER: ${OUTBOX_RETRY_BACKOFF_MULTIPLIER:-2.0}
      OUTBOX_MAX_RETRY_DELAY_SECONDS: ${OUTBOX_MAX_RETRY_DELAY_SECONDS:-300}
      WORKER_ONLINE_SCAN_INTERVAL: ${WORKER_ONLINE_SCAN_INTERVAL:-3.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RABBIT_USER_QUEUE_EXPIRES_MS: ${RABBIT_USER_QUEUE_EXPIRES_MS:-604800000}
      RABBIT_USER_QUEUE_MESSAGE_TTL_MS: ${RABBIT_USER_QUEUE_MESSAGE_TTL_MS:-86400000}
      RABBIT_USER_QUEUE_MAX_LENGTH: ${RABBIT_USER_QUEUE_MAX_LENGTH:-10000}
      REDIS_FANOUT_MAX_ATTEMPTS: ${REDIS_FANOUT_MAX_ATTEMPTS:-3}
      REDIS_FANOUT_INITIAL_RETRY_DELAY_SECONDS: ${REDIS_FANOUT_INITIAL_RETRY_DELAY_SECONDS:-0.5}
      REDIS_FANOUT_MAX_RETRY_DELAY_SECONDS: ${REDIS_FANOUT_MAX_RETRY_DELAY_SECONDS:-5.0}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [hardened_internal]

  merkle-checkpointer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      # Untracked and intentionally not loaded by backend/worker.
      - path: .env.merkle-checkpointer
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/channels}
      AUDIT_MERKLE_PUBLIC_KEYS: '${AUDIT_MERKLE_PUBLIC_KEYS:-{}}'
      AUDIT_MERKLE_BATCH_SIZE: "${AUDIT_MERKLE_BATCH_SIZE:-256}"
      AUDIT_MERKLE_CHECKPOINT_ENABLED: "${AUDIT_MERKLE_CHECKPOINT_ENABLED:-true}"
      AUDIT_MERKLE_CHECKPOINT_INTERVAL_SECONDS: "${AUDIT_MERKLE_CHECKPOINT_INTERVAL_SECONDS:-300}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "-m", "app.db.merkle_checkpointer"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [checkpoint_db]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,uid=10001,gid=10001,mode=1777
    pids_limit: 100
    mem_limit: 384m
    cpus: 0.5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: /v1
    depends_on:
      backend:
        condition: service_healthy
    networks: [hardened_internal]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      hardened_internal:
        ipv4_address: 172.31.240.10

networks:
  hardened_internal:
    ipam:
      config:
        - subnet: 172.31.240.0/24
  checkpoint_db:
    internal: true

volumes:
  pg_data:
  rabbit_data:
  uploads_data:
