worker_processes auto;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Bound parsed request resources before traffic reaches FastAPI/Next.js.
    client_max_body_size 26m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 15s;
    send_timeout 30s;
    reset_timedout_connection on;

    # Slow clients are bounded by both source address and total active requests.
    # Stock nginx send_timeout bounds write inactivity, not a guaranteed minimum
    # throughput; the application process-global lease remains a separate layer.
    limit_conn_zone $binary_remote_addr zone=download_per_ip:10m;
    limit_conn_zone $server_name zone=backend_total:10m;
    limit_conn_status 429;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_max_temp_file_size 32m;
    proxy_temp_file_write_size 64k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream messaging_backend {
        server backend:8000;
        keepalive 16;
    }

    upstream messaging_frontend {
        server frontend:3000;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        limit_conn download_per_ip 20;
        limit_conn backend_total 200;

        # The proxy overwrites rather than appends forwarding data. FastAPI
        # trusts it only when the immediate peer is this proxy's configured /32.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        location = /v1/ws {
            proxy_pass http://messaging_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            # WebSocket authentication has its own server-side expiry. This
            # timeout prevents an entirely idle transport from living forever.
            proxy_read_timeout 35m;
        }

        location /v1/ {
            proxy_pass http://messaging_backend;
            proxy_http_version 1.1;
        }

        location = /health {
            proxy_pass http://messaging_backend;
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass http://messaging_frontend;
            proxy_http_version 1.1;
        }
    }
}
