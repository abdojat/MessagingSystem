[project]
name = "channels-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "aio-pika>=9.5.0",
  "redis>=5.2.0",
  "pydantic-settings>=2.6.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
