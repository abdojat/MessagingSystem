openapi: 3.1.0
info:
  title: Channels Backend API
  version: 0.1.0
  description: Endpoint map inferred from backend routes.
servers:
  - url: http://localhost:8000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChannelId: { name: channel_id, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    InviteId: { name: invite_id, in: path, required: true, schema: { type: string, format: uuid } }
    MessageId: { name: message_id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, nullable: true, additionalProperties: true }
    ChannelPermissions:
      type: object
      required: [can_publish, can_invite, can_approve, can_manage_members, can_edit_channel, can_delete_channel]
      properties:
        can_publish: { type: boolean }
        can_invite: { type: boolean }
        can_approve: { type: boolean }
        can_manage_members: { type: boolean }
        can_edit_channel: { type: boolean }
        can_delete_channel: { type: boolean }
    ChannelResponse:
      type: object
      required: [id, owner_user_id, name, visibility, join_mode, created_at, my_role, permissions]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        name: { type: string }
        visibility: { type: string, enum: [public, private] }
        join_mode: { type: string, enum: [open, invite_only, approval_required] }
        created_at: { type: string, format: date-time }
        my_role: { type: string, enum: [owner, admin, member, pending, none] }
        permissions: { $ref: '#/components/schemas/ChannelPermissions' }
    MessageResponse:
      type: object
      required: [id, channel_id, sender_user_id, seq_id, content_type, created_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        sender_user_id: { type: string, format: uuid }
        seq_id: { type: integer }
        content_type: { type: string, enum: [text, json] }
        content_text: { type: string, nullable: true }
        content_json: { type: object, nullable: true, additionalProperties: true }
        client_msg_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    MessageListResponse:
      type: object
      required: [items, has_more, next_before_seq_id, next_after_seq_id, order]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MessageResponse' }
        has_more: { type: boolean }
        next_before_seq_id: { type: integer, nullable: true }
        next_after_seq_id: { type: integer, nullable: true }
        order: { type: string, enum: [asc, desc] }
      description: before_seq_id pages in desc order; after_seq_id pages in asc order.
    JoinOutcomeResponse:
      type: object
      required: [status, role, message]
      properties:
        status: { type: string, enum: [joined, pending, requires_invite, already_member] }
        role: { type: string, enum: [owner, admin, member, pending, none] }
        message: { type: string }
        channel:
          allOf: [ { $ref: '#/components/schemas/ChannelResponse' } ]
          nullable: true
    InviteListItem:
      type: object
      required: [id, channel_id, invited_user_id, invited_email, is_generic, masked_token, created_by_user_id, created_at, expires_at, accepted_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        invited_user_id: { type: string, format: uuid, nullable: true }
        invited_email: { type: string, nullable: true }
        is_generic: { type: boolean }
        masked_token: { type: string }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    WsHello:
      type: object
      required: [type, user_id, server_time]
      properties:
        type: { type: string, enum: [hello] }
        user_id: { type: string, format: uuid }
        server_time: { type: string, format: date-time }
    WsHistory:
      type: object
      required: [type, channel_id, items, is_truncated]
      properties:
        type: { type: string, enum: [history] }
        channel_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/MessageResponse' }
        is_truncated: { type: boolean }
    WsMessage:
      type: object
      required: [type, channel_id, message]
      properties:
        type: { type: string, enum: [message] }
        channel_id: { type: string, format: uuid }
        message: { $ref: '#/components/schemas/MessageResponse' }
    WsMembershipUpdate:
      type: object
      required: [type, channel_id, user_id, new_role, reason]
      properties:
        type: { type: string, enum: [membership_update] }
        channel_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        new_role: { type: string, enum: [owner, admin, member, pending, none] }
        reason: { type: string }
    WsSync:
      type: object
      required: [type, states]
      properties:
        type: { type: string, enum: [sync] }
        states:
          type: array
          items:
            type: object
            required: [channel_id]
            properties:
              channel_id: { type: string, format: uuid }
              last_seen_seq_id: { type: integer, nullable: true }
              last_seen_at: { type: string, format: date-time, nullable: true }
    WsSeen:
      type: object
      required: [type, channel_id, last_seen_seq_id]
      properties:
        type: { type: string, enum: [seen] }
        channel_id: { type: string, format: uuid }
        last_seen_seq_id: { type: integer }
        last_seen_at: { type: string, format: date-time, nullable: true }

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200': { description: '{status,db,redis,rabbitmq}' }

  /auth/register:
    post:
      tags: [auth]
      summary: Register
      requestBody: { required: true }
      responses:
        '201': { description: '{id,username,email}' }
        '409': { description: username/email exists }
        '422': { description: validation error }

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody: { required: true }
      responses:
        '200': { description: TokenPair }
        '401': { description: invalid credentials }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh tokens
      requestBody: { required: true }
      responses:
        '200': { description: TokenPair }
        '401': { description: invalid/expired refresh token }

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout refresh session
      requestBody: { required: true }
      responses:
        '200': { description: '{status: ok}' }
        '401': { description: invalid token }

  /auth/sessions:
    get:
      tags: [auth]
      security: [ { bearerAuth: [] } ]
      summary: List current-user sessions
      responses:
        '200': { description: SessionListResponse }
        '401': { description: missing/invalid bearer token }

  /auth/logout_all:
    post:
      tags: [auth]
      security: [ { bearerAuth: [] } ]
      summary: Revoke all current-user sessions
      responses:
        '200': { description: LogoutAllResponse }

  /auth/sessions/{session_id}:
    delete:
      tags: [auth]
      security: [ { bearerAuth: [] } ]
      summary: Revoke one session
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200': { description: '{status: ok}' }
        '404': { description: session not found }
        '422': { description: invalid session_id format }

  /me:
    get:
      tags: [users]
      security: [ { bearerAuth: [] } ]
      summary: Current user profile
      responses:
        '200': { description: MeResponse }
        '401': { description: unauthorized }

  /channels:
    post:
      tags: [channels]
      security: [ { bearerAuth: [] } ]
      summary: Create channel
      requestBody: { required: true }
      responses:
        '201': { description: ChannelResponse }
    get:
      tags: [channels]
      security: [ { bearerAuth: [] } ]
      summary: List visible channels for current user
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [my, discover], default: my }, description: "my returns the caller's memberships, including pending requests; discover returns public channels where the caller has no membership row." }
        - { name: visibility, in: query, schema: { type: string, enum: [public, private] }, description: "Optional visibility filter. discover remains public-only." }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 255 }, description: "Literal channel search over display name and channel slug; #slug shorthand is accepted." }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: ChannelListResponse with items, next_cursor, has_more }

  /channels/{channel_id}:
    get:
      tags: [channels]
      security: [ { bearerAuth: [] } ]
      summary: Get channel
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      responses:
        '200': { description: ChannelResponse }
        '403': { description: private channel forbidden }
        '404': { description: channel not found }
    patch:
      tags: [channels]
      security: [ { bearerAuth: [] } ]
      summary: Patch channel (owner or admin with can_edit_channel)
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      requestBody: { required: true }
      responses:
        '200': { description: ChannelResponse }
        '403': { description: forbidden }
        '404': { description: channel not found }
        '422': { description: empty patch or validation error }
    delete:
      tags: [channels]
      security: [ { bearerAuth: [] } ]
      summary: Delete channel (owner only)
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      responses:
        '200': { description: '{status: ok}' }
        '403': { description: forbidden }
        '404': { description: channel not found }

  /channels/{channel_id}/my-membership:
    get:
      tags: [channels]
      security: [ { bearerAuth: [] } ]
      summary: My membership in channel
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      responses:
        '200': { description: MyMembershipResponse }
        '404': { description: channel not found }

  /channels/{channel_id}/join:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Join channel (open/invite_only/approval_required)
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      requestBody: { required: true }
      responses:
        '200': { description: JoinOutcomeResponse }
        '400': { description: invalid/expired invite }
        '403': { description: invite/user mismatch }
        '404': { description: channel/user not found }

  /channels/{channel_id}/leave:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Leave channel
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      responses:
        '200': { description: '{status: ok}' }
        '404': { description: membership not found }
        '409': { description: owner cannot leave }

  /channels/{channel_id}/members:
    get:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: List members (owner/admin)
      parameters:
        - { $ref: '#/components/parameters/ChannelId' }
        - { name: role, in: query, schema: { type: string, enum: [owner, admin, member, pending] } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 255 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: ChannelMembershipListResponse }
        '403': { description: forbidden }
        '404': { description: channel not found }
        '422': { description: invalid cursor }

  /channels/{channel_id}/requests:
    get:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: List pending requests (owner/admin)
      parameters:
        - { $ref: '#/components/parameters/ChannelId' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: ChannelMembershipListResponse(role=pending) }

  /channels/{channel_id}/invite:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Create invite
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      requestBody: { required: true }
      responses:
        '200': { description: InviteResponse }
        '403': { description: forbidden }
        '404': { description: channel not found }

  /channels/{channel_id}/invites:
    get:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: List invites (owner/admin)
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      responses:
        '200': { description: InviteListResponse (masked_token only, never full token) }

  /channels/{channel_id}/invites/{invite_id}/revoke:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Revoke invite
      parameters:
        - { $ref: '#/components/parameters/ChannelId' }
        - { $ref: '#/components/parameters/InviteId' }
      responses:
        '200': { description: '{status: ok}' }
        '404': { description: invite/channel not found }

  /invites/{token}:
    get:
      tags: [memberships]
      summary: Preview invite token
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: InvitePreviewResponse }

  /invites/{token}/accept:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Accept invite token
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: MembershipActionResponse }
        '400': { description: invite invalid }
        '403': { description: invite not for this user/email }
        '404': { description: invite/channel/user not found }
        '409': { description: invite already accepted }

  /channels/{channel_id}/members/{user_id}/approve:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Approve pending member
      parameters: [ { $ref: '#/components/parameters/ChannelId' }, { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: MembershipActionResponse }
        '400': { description: target not pending }
        '403': { description: forbidden }
        '404': { description: membership not found }

  /channels/{channel_id}/members/{user_id}/add:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Add member directly
      parameters: [ { $ref: '#/components/parameters/ChannelId' }, { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: MembershipActionResponse }
        '403': { description: forbidden }

  /channels/{channel_id}/members/{user_id}/promote:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Promote member to admin
      parameters: [ { $ref: '#/components/parameters/ChannelId' }, { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: MembershipActionResponse }
        '403': { description: forbidden }
        '404': { description: membership not found }

  /channels/{channel_id}/members/{user_id}/demote:
    post:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Demote admin to member
      parameters: [ { $ref: '#/components/parameters/ChannelId' }, { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: MembershipActionResponse }
        '403': { description: forbidden }
        '404': { description: membership not found }

  /channels/{channel_id}/members/{user_id}:
    delete:
      tags: [memberships]
      security: [ { bearerAuth: [] } ]
      summary: Remove member
      parameters: [ { $ref: '#/components/parameters/ChannelId' }, { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: '{status: ok}' }
        '403': { description: forbidden }
        '404': { description: membership not found }

  /channels/{channel_id}/messages:
    post:
      tags: [messages]
      security: [ { bearerAuth: [] } ]
      summary: Publish message
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      requestBody: { required: true }
      responses:
        '201': { description: MessageResponse }
        '403': { description: forbidden }
        '404': { description: channel not found }
        '422': { description: content validation error }
    get:
      tags: [messages]
      security: [ { bearerAuth: [] } ]
      summary: List messages
      parameters:
        - { $ref: '#/components/parameters/ChannelId' }
        - { name: before_seq_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: after_seq_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: MessageListResponse (before_seq_id => desc, after_seq_id => asc) }
        '403': { description: forbidden }
        '404': { description: channel not found }
        '422': { description: both before_seq_id and after_seq_id set }

  /channels/{channel_id}/messages/around:
    get:
      tags: [messages]
      security: [ { bearerAuth: [] } ]
      summary: List messages around seq_id
      parameters:
        - { $ref: '#/components/parameters/ChannelId' }
        - { name: seq_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 3, maximum: 200, default: 40 } }
      responses:
        '200': { description: MessageAroundResponse }

  /channels/{channel_id}/messages/{message_id}:
    get:
      tags: [messages]
      security: [ { bearerAuth: [] } ]
      summary: Get message by id
      parameters: [ { $ref: '#/components/parameters/ChannelId' }, { $ref: '#/components/parameters/MessageId' } ]
      responses:
        '200': { description: MessageResponse }
        '403': { description: forbidden }
        '404': { description: message or channel not found }

  /channels/{channel_id}/seen:
    post:
      tags: [messages]
      security: [ { bearerAuth: [] } ]
      summary: Mark channel seen state
      parameters: [ { $ref: '#/components/parameters/ChannelId' } ]
      requestBody: { required: true }
      responses:
        '200': { description: SeenResponse }
        '403': { description: not a channel member }
        '422': { description: missing seen markers }

  /channels/{channel_id}/events:
    get:
      tags: [events]
      security: [ { bearerAuth: [] } ]
      summary: List channel events (owner/admin)
      parameters:
        - { $ref: '#/components/parameters/ChannelId' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: EventListResponse }
        '403': { description: forbidden }
        '404': { description: channel not found }
        '422': { description: invalid cursor }

  /channels/{channel_id}/events/integrity:
    get:
      tags: [events]
      security: [ { bearerAuth: [] } ]
      summary: Verify channel event-log hash-chain integrity (owner/admin)
      parameters:
        - { $ref: '#/components/parameters/ChannelId' }
      responses:
        '200': { description: EventIntegrityResponse with valid/broken status, checked event count, last hash, and first broken event id when applicable }
        '403': { description: forbidden }
        '404': { description: channel not found }

  /ws:
    get:
      tags: [messages]
      summary: WebSocket endpoint
      description: Use query token=`<access-token>` or header Authorization Bearer token.
      x-websocket:
        auth: { query_token: true, bearer_header: true }
        accepted_client_messages: [sync, seen]
        possible_server_messages: [hello, history, message, membership_update, channel_updated]
        server_payload_schemas:
          hello: { $ref: '#/components/schemas/WsHello' }
          history: { $ref: '#/components/schemas/WsHistory' }
          message: { $ref: '#/components/schemas/WsMessage' }
          membership_update: { $ref: '#/components/schemas/WsMembershipUpdate' }
        client_payload_schemas:
          sync: { $ref: '#/components/schemas/WsSync' }
          seen: { $ref: '#/components/schemas/WsSeen' }
      responses:
        '101': { description: Switching Protocols }
