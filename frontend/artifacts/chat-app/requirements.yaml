packages:
  "zustand": "State management for authentication and current user"
  "date-fns": "Human readable date formatting for messages"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility for merging tailwind classes without style conflicts"
  "lucide-react": "Beautiful consistent icons"
  "@hookform/resolvers": "Zod integration for react-hook-form"
  "react-hook-form": "Performant, flexible and extensible forms with easy-to-use validation"
  "zod": "TypeScript-first schema validation"

images:
  - path: "artifacts/chat-app/public/images/auth-bg.png"
    description: "Abstract dark elegant background with subtle deep indigo and purple gradients, very minimal, professional chat app aesthetic"
    aspect_ratio: "16:9"

notes:
  - Assumes backend is running at VITE_API_BASE_URL (fallback to /api if not set)
  - Interceptors implemented in apiClient to automatically handle 401 refresh token logic
  - WebSockets implemented with exponential backoff reconnection
